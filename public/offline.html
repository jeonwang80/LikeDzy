<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233328">
  <title>LIKEDZY · 연결 확인</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #f5f6f3; color: #18231c; font-family: system-ui, sans-serif; padding: 24px; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: -1px; margin-bottom: 48px; }
    h1 { font-size: 24px; line-height: 1.4; word-break: keep-all; }
    p { color: #5b665e; line-height: 1.7; font-size: 15px; word-break: keep-all; }
    button { margin-top: 20px; width: 100%; min-height: 48px; border: 0; border-radius: 8px; background: #233328; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #3e72c9; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">LIKEDZY</div>
    <h1 id="title">인터넷 연결을 확인해 주세요</h1>
    <p id="message">상품과 주문 정보를 보려면 인터넷 연결이 필요합니다. 연결 후 다시 시도해 주세요.</p>
    <button type="button" id="retry">다시 시도</button>
  </main>
  <script>
    let language = navigator.language;
    try { language = localStorage.getItem('likedzy-language') || language; } catch { /* optional */ }
    if (!language.startsWith('ko')) {
      document.documentElement.lang = 'en';
      document.title = 'LIKEDZY · Check connection';
      document.getElementById('title').textContent = 'Check your internet connection';
      document.getElementById('message').textContent = 'Connect to the internet to view products and orders, then try again.';
      document.getElementById('retry').textContent = 'Try again';
    }
    document.getElementById('retry').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
