<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">회원 주문 쿠폰 ERD</title><desc id="desc">Firebase Auth 계정은 여러 주문과 보유 쿠폰을 가질 수 있습니다. 비회원 주문은 userId가 없습니다. 주문은 여러 이벤트를 가지며 쿠폰 사용 문서는 회원과 쿠폰 조합당 하나로 현재 연결 주문을 기록합니다. 주문당 쿠폰은 선택적으로 하나입니다.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#293d30}.entity{font-size:19px;font-weight:700}.subtitle{font-size:13px;fill:#64745a}.field{font-size:14px;font-family:Consolas,monospace}.relation{font-size:13px;font-weight:700}.legend{font-size:13px;fill:#617058}</style><rect width="1000" height="700" rx="14" fill="#f7f9f4"/><path d="M290 130H365" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="285" y="103" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="327" y="120" text-anchor="middle" class="relation">0..1 : N</text><path d="M635 130H710" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="630" y="103" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="672" y="120" text-anchor="middle" class="relation">1 : 1..N</text><path d="M155 285V390" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="113" y="325" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="155" y="342" text-anchor="middle" class="relation">1 : 0..N</text><path d="M365 495H290" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="285" y="468" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="327" y="485" text-anchor="middle" class="relation">1 : 0..N</text><path d="M635 495H710" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="630" y="468" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="672" y="485" text-anchor="middle" class="relation">1 : 0..N</text><path d="M500 390V285" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="458" y="325" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="500" y="342" text-anchor="middle" class="relation">0..1 : N</text><path d="M845 390V330H595V285" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="718" y="303" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="760" y="320" text-anchor="middle" class="relation">0..1 : 1</text><g transform="translate(20 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6edf7"/><text x="18" y="30" class="entity">Firebase Auth</text><text x="18" y="57" class="subtitle">계정 서비스 · Firestore 밖</text><text x="18" y="106" dy="0" class="field">KEY uid</text><text x="18" y="106" dy="27" class="field">email · displayName</text><text x="18" y="106" dy="54" class="field">emailVerified · disabled</text><text x="18" y="106" dy="81" class="field">providerData[]</text><text x="18" y="106" dy="108" class="field">metadata.creationTime</text></g><g transform="translate(365 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">orders</text><text x="18" y="57" class="subtitle">주문 시점의 확정 데이터</text><text x="18" y="106" dy="0" class="field">DOC orderId</text><text x="18" y="106" dy="27" class="field">REF userId? · couponCode?</text><text x="18" y="106" dy="54" class="field">items[] · bankSnapshot{}</text><text x="18" y="106" dy="81" class="field">subtotal · discountAmount</text><text x="18" y="106" dy="108" class="field">totalAmountNumber · status</text></g><g transform="translate(710 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">orderEvents</text><text x="18" y="57" class="subtitle">주문 처리 이력</text><text x="18" y="106" dy="0" class="field">DOC eventId</text><text x="18" y="106" dy="27" class="field">REF orderId · userId?</text><text x="18" y="106" dy="54" class="field">actorUid? · type</text><text x="18" y="106" dy="81" class="field">fromStatus? · toStatus</text><text x="18" y="106" dy="108" class="field">note? · createdAt</text></g><g transform="translate(20 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">userCoupons</text><text x="18" y="57" class="subtitle">회원에게 발급된 쿠폰</text><text x="18" y="106" dy="0" class="field">DOC hash(code:userId)</text><text x="18" y="106" dy="27" class="field">REF userId · code</text><text x="18" y="106" dy="54" class="field">orderId? · redeemedAt?</text><text x="18" y="106" dy="81" class="field">createdAt · issuedBy?</text><text x="18" y="106" dy="108" class="field">발급 당시 조건 사본</text></g><g transform="translate(365 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">coupons</text><text x="18" y="57" class="subtitle">쿠폰 행사 · 최신 조건</text><text x="18" y="106" dy="0" class="field">DOC CODE</text><text x="18" y="106" dy="27" class="field">percent · currency</text><text x="18" y="106" dy="54" class="field">minSubtotal · maxDiscount</text><text x="18" y="106" dy="81" class="field">startsAt · endsAt · active</text><text x="18" y="106" dy="108" class="field">autoIssue · usageLimit</text></g><g transform="translate(710 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">couponUses</text><text x="18" y="57" class="subtitle">회원 × 코드별 사용 상태</text><text x="18" y="106" dy="0" class="field">DOC hash(code:userId)</text><text x="18" y="106" dy="27" class="field">REF userId · code</text><text x="18" y="106" dy="54" class="field">REF orderId</text><text x="18" y="106" dy="81" class="field">released · releasedAt?</text><text x="18" y="106" dy="108" class="field">createdAt</text></g><text x="20" y="682" class="legend">DOC = 문서 ID · REF = 코드상 참조 · 1 = 하나 · 0..1 = 선택적 하나 · 0..N = 여러 개 가능</text></svg>
