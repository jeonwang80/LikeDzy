<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">상품과 재고 ERD</title><desc id="desc">카테고리 하나에 여러 상품, 상품 하나에 여러 SKU 재고와 주문 항목이 연결됩니다. 재고 문서와 공개 재고는 같은 ID의 일대일 관계이며 재고 변동 이력은 여러 건입니다. orders.items는 별도 컬렉션이 아닌 주문 내부 배열입니다.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#293d30}.entity{font-size:19px;font-weight:700}.subtitle{font-size:13px;fill:#64745a}.field{font-size:14px;font-family:Consolas,monospace}.relation{font-size:13px;font-weight:700}.legend{font-size:13px;fill:#617058}</style><rect width="1000" height="700" rx="14" fill="#f7f9f4"/><path d="M290 130H365" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="285" y="103" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="327" y="120" text-anchor="middle" class="relation">0..1 : N</text><path d="M635 130H710" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="630" y="103" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="672" y="120" text-anchor="middle" class="relation">1 : 0..N</text><path d="M845 285V390" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="803" y="325" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="845" y="342" text-anchor="middle" class="relation">1 : 1</text><path d="M775 285V325H500V390" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="538" y="298" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="580" y="315" text-anchor="middle" class="relation">1 : 0..N</text><path d="M415 285V340H155V390" fill="none" stroke="#6d8262" stroke-width="2"/><rect x="233" y="313" width="84" height="26" rx="5" fill="#f7f9f4"/><text x="275" y="330" text-anchor="middle" class="relation">1 : 0..N</text><g transform="translate(20 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">categoryMasters</text><text x="18" y="57" class="subtitle">카테고리 기준정보</text><text x="18" y="106" dy="0" class="field">DOC categoryId</text><text x="18" y="106" dy="27" class="field">code · level1/2/3Code</text><text x="18" y="106" dy="54" class="field">level1/2/3Name</text><text x="18" y="106" dy="81" class="field">active · sortOrder</text><text x="18" y="106" dy="108" class="field">createdAt · updatedAt</text></g><g transform="translate(365 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">products</text><text x="18" y="57" class="subtitle">상품 · 현재 옵션</text><text x="18" y="106" dy="0" class="field">DOC productId</text><text x="18" y="106" dy="27" class="field">REF categoryMasterId?</text><text x="18" y="106" dy="54" class="field">category · prices{}</text><text x="18" y="106" dy="81" class="field">colorSwatches[] · sizeOptions[]</text><text x="18" y="106" dy="108" class="field">measurementGuide{}</text></g><g transform="translate(710 35)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">inventory</text><text x="18" y="57" class="subtitle">색상 × 사이즈별 재고</text><text x="18" y="106" dy="0" class="field">DOC variantId</text><text x="18" y="106" dy="27" class="field">REF productId</text><text x="18" y="106" dy="54" class="field">colorName · optionName</text><text x="18" y="106" dy="81" class="field">stock · reserved · sold</text><text x="18" y="106" dy="108" class="field">version · updatedAt</text></g><g transform="translate(20 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#f2ecdd"/><text x="18" y="30" class="entity">orders.items[]</text><text x="18" y="57" class="subtitle">주문 내부 배열 · 별도 컬렉션 아님</text><text x="18" y="106" dy="0" class="field">REF productId · variantId</text><text x="18" y="106" dy="27" class="field">productName</text><text x="18" y="106" dy="54" class="field">colorName · optionName</text><text x="18" y="106" dy="81" class="field">quantity · unitPrice</text><text x="18" y="106" dy="108" class="field">lineAmount</text></g><g transform="translate(365 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6eee2"/><text x="18" y="30" class="entity">inventoryMovements</text><text x="18" y="57" class="subtitle">재고 변경 기록</text><text x="18" y="106" dy="0" class="field">DOC movementId</text><text x="18" y="106" dy="27" class="field">REF variantId · productId</text><text x="18" y="106" dy="54" class="field">REF orderId? · actorUid?</text><text x="18" y="106" dy="81" class="field">type · stockDelta</text><text x="18" y="106" dy="108" class="field">stockAfter · version</text></g><g transform="translate(710 390)"><rect width="270" height="250" rx="12" fill="white" stroke="#cbd7c5"/><path d="M12 0H258Q270 0 270 12V77H0V12Q0 0 12 0" fill="#e6edf7"/><text x="18" y="30" class="entity">stockAvailability</text><text x="18" y="57" class="subtitle">스토어 공개용 재고</text><text x="18" y="106" dy="0" class="field">DOC variantId (동일 ID)</text><text x="18" y="106" dy="27" class="field">REF productId</text><text x="18" y="106" dy="54" class="field">colorName · optionName</text><text x="18" y="106" dy="81" class="field">available (= stock)</text><text x="18" y="106" dy="108" class="field">updatedAt</text></g><text x="20" y="682" class="legend">DOC = 문서 ID · REF = 코드상 참조 · 1 = 하나 · 0..1 = 선택적 하나 · 0..N = 여러 개 가능</text></svg>
